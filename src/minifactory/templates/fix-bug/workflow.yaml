# Fixes a bug in an EXISTING GitHub repository: reproduces it with a failing test, fixes it, opens a PR.
# Works in any stack that has a profile (python, node, flutter; add your own in stacks/). Never touches the
# default branch: the work goes to a new branch and a pull request. Needs `gh auth login`, AWS credentials for
# Bedrock and the stack's own tools. Costs LLM tokens.

name: fix-bug

route:
  description: Fix a bug in an EXISTING GitHub repository. Reproduces it with a failing test, fixes it and opens a pull request
  not_for:
    - creating a new app or project from scratch
    - adding a new feature to an existing repository
    - upgrading or migrating versions
  examples:
    - fix the crash on login in acme/todo_app
    - fix the null error when the list is empty in acme/todo_app
  needs: the GitHub repository as owner/name and a description of the wrong behaviour
  intake: repo-task
  delivery: fixed

vars:
  max_files: 8
  max_lines: 300

source:
  use: repo-tasks
  with: { path: tasks }

executor:
  use: threads
  with: { workers: 1 }

providers:
  scm:
    use: github                 # jobs are `owner/name`; a PR is opened on the repo itself
  llm:
    use: bedrock
    with:
      model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      region: us-east-1
      max_tokens: 16384
      price_per_mtok: { input: 1.0, output: 5.0 }   # USD per 1M tokens: check current prices

steps:
  - id: guard
    use: scm.guard_no_open_pr
    with: { branch: "${job.branch}" }

  - id: clone
    use: scm.clone

  # Which stack is this repository? Unknown or ambiguous = stop, nothing is spent.
  - id: detect
    use: stack.detect
    on_fail: discard

  # A repo that does not even analyse cleanly cannot be judged: stop before spending anything.
  - id: baseline
    use: stack.check
    with: { check: analyze, stack: "${steps.detect.outputs.stack}" }
    on_fail: discard

  - id: locate
    use: agent.locate_files
    with: { task: "${job.task}", stack: "${steps.detect.outputs.stack}" }

  # 1. Prove the bug: a new test, only in the stack's test folders, that fails because of it.
  - id: repro
    use: agent.edit
    with:
      stack: "${steps.detect.outputs.stack}"
      tests_only: true
      instruction: >-
        Write ONE new test file, at the REPRO_TEST_PATH above, that reproduces this bug and fails because of
        it (not because of a missing import or a syntax error). Change no other file. BUG: ${job.task}
      files: "${steps.locate.outputs.files}"
      commit_message: "test: reproduce the bug"

  - id: repro_fails
    use: stack.check
    with: { check: test, repro: true, expect_failure: true, stack: "${steps.detect.outputs.stack}" }
    on_fail: discard            # not reproduced = nothing safe to fix: stop, change nothing

  # 2. Fix it with the smallest change that makes that test pass.
  - id: fix
    use: agent.edit
    with:
      stack: "${steps.detect.outputs.stack}"
      instruction: >-
        Fix this bug with the smallest possible change to the production code. Do not edit the reproduction
        test. Prefer PATCH edits. BUG: ${job.task}
      files: "${steps.locate.outputs.files}"
      extra: "${steps.repro_fails.outputs.output}"
      commit_message: "fix: ${job.repo}"

  - id: analyze
    use: stack.check
    with: { check: analyze, stack: "${steps.detect.outputs.stack}" }
    on_fail: continue

  - id: test
    use: stack.check
    with: { check: test, stack: "${steps.detect.outputs.stack}" }
    on_fail: continue

  - id: repair
    use: agent.repair_build
    when: "steps.analyze.status == 'failed' or steps.test.status == 'failed'"
    with:
      stack: "${steps.detect.outputs.stack}"
      checks: [analyze, test]
      max_attempts: 3
      max_unproductive: 2

  - id: size
    use: scm.diff_limit
    with: { max_files: "${vars.max_files}", max_lines: "${vars.max_lines}" }

  - id: deliver
    use: scm.open_pr
    with:
      branch: "${job.branch}"
      title: "fix: automated bug fix for ${job.repo}"
      body: "${job.task}"
