# Same factory, but the LLM is Amazon Bedrock. Needs `pip install -e ".[aws]"` and AWS credentials.
# Use FACTORY_FLUTTER=real for the real Flutter SDK. Re-check the price_per_mtok values.
# Creates a Flutter app from a spec: plan -> implement -> gates -> repair -> PR.
# Run from the project root:  factory run workflows/flutter-app-factory.yaml
# Uses a deterministic fake `flutter` and canned LLM replies by default (no SDK, no tokens).
# Real SDK: FACTORY_FLUTTER=real.  Real LLM: swap `llm` for `openai` (see README).

name: flutter-app-factory-bedrock

# Makes this workflow reachable from `factory ask "..."`.
route:
  description: Create a brand-new Flutter mobile app from an idea or short description
  not_for:
    - modifying, fixing or migrating an existing repository
    - backend services or web sites
  examples:
    - an app to track my daily expenses
    - a simple to-do list app for iOS and Android
  needs: a rough idea of what the app should do (one line is enough; details are filled in later)
  intake: app-spec

vars:
  min_coverage: 80

# What to build: one job per spec in specs/ (the "queue of app ideas").
source:
  use: app-specs
  with: { path: specs }

executor:
  use: threads
  with: { workers: 2 }

providers:
  scm:
    use: local-dir            # `factory ask --output github` swaps this for a new GitHub repo + PR
    with: { dir: output }
  llm:
    use: bedrock
    with:
      model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      region: us-east-1
      max_tokens: 16384
      price_per_mtok: { input: 1.0, output: 5.0 }   # USD per 1M tokens: check current prices

steps:
  # Dedupe: an app that already has its branch is not rebuilt.
  - id: guard
    use: scm.guard_no_open_pr
    with: { branch: "factory/${job.name}" }

  - id: init
    use: scm.init_repo

  - id: create
    use: flutter.create

  # The LLM plans first; the plan is validated, so a vague spec fails here and cheaply.
  - id: plan
    use: agent.plan_app

  - id: implement
    use: agent.implement_spec
    with:
      features: "${steps.plan.outputs.features}"
      context_globs: ["pubspec.yaml", "lib/**/*.dart", "test/**/*.dart"]   # pubspec: the LLM must see which packages exist

  # Deterministic gates. Red is not fatal yet: the repair loop gets a chance.
  - id: analyze
    use: flutter.analyze
    on_fail: continue

  - id: test
    use: flutter.test
    on_fail: continue

  - id: repair
    use: agent.repair_build
    when: "steps.analyze.status == 'failed' or steps.test.status == 'failed'"
    with:
      verify_cmd: "${env.python} -m factory.plugins.builtin.flutter_tool analyze && ${env.python} -m factory.plugins.builtin.flutter_tool test"
      globs: ["pubspec.yaml", "lib/**/*.dart", "test/**/*.dart"]   # pubspec: a missing package is a fixable build error
      max_attempts: 4
      max_unproductive: 2

  # Never blocks the PR; a miss is written into its description.
  - id: coverage
    use: flutter.test
    blocking: false
    with: { min_coverage: "${vars.min_coverage}" }

  - id: deliver
    use: scm.open_pr
    with:
      branch: "factory/${job.name}"
      title: "feat: ${job.name} (generated)"
      body: "${job.description}"
